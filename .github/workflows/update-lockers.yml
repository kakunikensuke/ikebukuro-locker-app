name: Update lockers

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run locker update batch
        working-directory: backend
        run: npm run update:lockers

      # バッチが途中で失敗しても取得できた分は保存されているので、always()でコミットを試みる
      # （変更が無ければcommitはスキップされる）。
      # update-log.jsonは.gitignore対象（実行時生成物）なのでaddしない。
      # ここにgitignore済みのパスを渡すとgit addがexit 1になり、
      # push手順ごと落ちる（2026-08-10まで実際にこれで失敗していた）。
      # 失敗した駅・ソースの内容はバッチのログ出力で確認する。
      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- backend/data/lockers.json
          git diff --cached --quiet || git commit -m "ロッカーデータを自動更新 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
